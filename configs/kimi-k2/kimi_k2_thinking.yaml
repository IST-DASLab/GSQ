# Production config — Kimi-K2-Thinking
# Uses paths relative to the working directory; set GSQ_RUNTIME in .env/shell if artifacts should leave the repo (see scripts/_common.sh).
#
# Model: moonshotai/Kimi-K2-Thinking  (model_type: deepseek_v3 / kimi_k2)
#   Architecture confirmed via AutoConfig:
#   - 384 routed experts, 8 active per token  (n_routed_experts=384)
#   - 61 decoder layers, first_k_dense_replace=1 (1 dense layer + 60 MoE)
#   - hidden_size=7168, moe_intermediate_size=2048, n_shared_experts=1
#   - Same architecture as Kimi-K2.5; different fine-tune (thinking/reasoning)
#   - Uses KimiK2DistributedWrapper (deepseek_v3 code path)
#
# Scaling guidance (4 GPUs/node):
#   2 nodes ( 8 GPUs) — 48 experts/GPU, ~24h for 60 MoE layers
#   4 nodes (16 GPUs) — 24 experts/GPU, ~12h for 60 MoE layers
#   8 nodes (32 GPUs) — 12 experts/GPU, ~6h  for 60 MoE layers
#
# Scratch layout:
#   With GSQ_RUNTIME set, YAML may use paths like "${GSQ_RUNTIME}/checkpoints/...", "${GSQ_RUNTIME}/logs/...", etc. (expandvars in load_config).
#   Typical layout under <repo>/runtime (default GSQ_RUNTIME)
#     .hf/                              ← HF_HOME  (set in gsq.toml)
#       models/Kimi-K2-Thinking/        ← local model clone (code + weights)
#     checkpoints/kimi-k2-thinking/   ← per-layer .safetensors shards
#     logs/kimi-k2-thinking/          ← Python training logs

model:
  name: "moonshotai/Kimi-K2-Thinking"
  device: "cuda"
  dtype: "bfloat16"

data:
  dataset_name: "open_thoughts"
  batch_size: 64
  num_samples: 4096
  max_length: 4096
  num_workers: 8
  val_samples: 128

quantization:
  gsq_bits: 2
  init_method: "gptq"
  gsq_enabled: true
  start_layer: 0
  self_attn: false
  std: 0.01
  temperature: [2, 0.05]
  scale: [100, 500]
  groupsize: 128
  strength: 6
  logits_dtype: "bfloat16"

training:
  num_epochs: 10
  device_microbatch_size: 2
  masks_lr: 0.0002
  signs_lr: 0.0001
  scales_lr: 0.0001
  weight_decay: 1.0
  checkpoint_dir: "checkpoints/kimi-k2-thinking"
  log_dir: "logs/kimi-k2-thinking"
  act_cache_dir: "cache/act_cache"
  eval_baseline: true
  # ppl_eval_every_n_layers: 6

gptq:
  nsamples: 512
  wbits: 2
  sym: true
  trits: false
  percdamp: 0.1
  blocksize: 128
  groupsize: 128
  static_groups: false
  prunen: 0
  prunem: 0

wandb:
  enabled: true
  entity: "ist"
  project: "GSQ-multi"
