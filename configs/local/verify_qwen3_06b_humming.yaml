model:
  name: "Qwen/Qwen3-0.6B"
  device: "cuda"
  dtype: "bfloat16"
  dummy: false

data:
  dataset_name: "c4"
  batch_size: 8
  num_samples: 32
  val_samples: 8
  max_length: 512
  num_workers: 2

quantization:
  gsq_bits: 2
  init_method: "gptq"
  gsq_enabled: true
  start_layer: 0
  self_attn: false
  std: 0.01
  temperature: [2, 0.5]
  scale: [10, 50]
  groupsize: 128
  strength: 6
  logits_dtype: "bfloat16"

training:
  num_epochs: 1
  device_microbatch_size: 4
  lr1: 0.0002
  lr2: 0.0001
  weight_decay: 1.0
  checkpoint_dir: "/nfs/scistore19/alistgrp/mhelcig/tmp/gsq_humming_smoke/checkpoints"
  log_dir: "/nfs/scistore19/alistgrp/mhelcig/tmp/gsq_humming_smoke/logs"
  eval_baseline: false
  ppl_eval_every_n_layers: 0

gptq:
  nsamples: 16
  wbits: 2
  sym: true
  trits: false
  percdamp: 0.1
  blocksize: 128
  groupsize: 128
  static_groups: false
  prunen: 0
  prunem: 0

wandb: false
