# Production config — Kimi-K2.5
# Uses paths relative to the working directory; set GSQ_RUNTIME in .env/shell if artifacts should leave the repo (see scripts/_common.sh).
#
# Scratch layout:
#   With GSQ_RUNTIME set, YAML may use paths like "${GSQ_RUNTIME}/checkpoints/...", "${GSQ_RUNTIME}/logs/...", etc. (expandvars in load_config).
#   Typical layout under <repo>/runtime (default GSQ_RUNTIME)
#     .hf/                         ← HF_HOME  (set in gsq.toml)
#     models/
#       Kimi-K2.5/         ← local model clone (code + weights)
#     checkpoints/kimi-k2.5/  ← per-layer .safetensors shards (active run)
#     logs/kimi-k2.5/         ← Python training logs

model:
  name: "moonshotai/Kimi-K2.5"
  device: "cuda"
  dtype: "bfloat16"
  # dummy: false

data:
  dataset_name: "open_thoughts"
  batch_size: 64
  num_samples: 4096
  max_length: 4096
  num_workers: 8
  val_samples: 128
  # seed: 0
  # shuffle_seed: 1234
  # shuffle_buffer_size: 100000
  # open_thoughts_max_samples: 10000

quantization:
  gsq_bits: 2
  init_method: "gptq"
  gsq_enabled: true
  start_layer: 0
  self_attn: false
  std: 0.01
  temperature: [2, 0.05]
  scale: [100, 500]
  groupsize: 128
  strength: 6
  logits_dtype: "bfloat16"

training:
  num_epochs: 10
  device_microbatch_size: 2
  masks_lr: 0.0002
  signs_lr: 0.0001
  scales_lr: 0.0001
  weight_decay: 1.0
  checkpoint_dir: "checkpoints/kimi-k2.5"
  log_dir: "logs/kimi-k2.5"
  act_cache_dir: "cache/act_cache"
  eval_baseline: True
  # lion_betas: [0.9, 0.95]
  # warmup_steps: 0
  # lr_decay_type: "cosine"
  # scheduler_min_lr: 0.1
  # meta_init_std: 0.02
  # act_cache_mmap_threshold_gb: 2.0
  # ppl_eval_every_n_layers: 6

gptq:
  nsamples: 512
  wbits: 2
  sym: true
  trits: false
  percdamp: 0.1
  blocksize: 128
  groupsize: 128
  static_groups: false
  prunen: 0
  prunem: 0

wandb:
  enabled: true
  entity: "ist"
  project: "GSQ-multi"

