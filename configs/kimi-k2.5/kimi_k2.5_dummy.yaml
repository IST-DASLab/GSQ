# Debug config — Kimi-K2.5 with dummy (zero) weights.
# Loads the model architecture from the real checkpoint dir but skips reading
# any .safetensors shard.  Use this to iterate on code logic quickly.
#
# Usage (1 node × 4 GPUs, debug partition):
#   srun --environment=./scripts/gsq.toml --label bash -c '
#     source "${SCRATCH:-runtime}/gsq/venv-gsq/bin/activate"
#     export RANK=$SLURM_PROCID LOCAL_RANK=$SLURM_LOCALID WORLD_SIZE=$SLURM_NTASKS
#     export MASTER_ADDR=$(scontrol show hostnames "$SLURM_JOB_NODELIST"|head -n1)
#     export MASTER_PORT=29500
#     python main.py --config configs/kimi-k2.5/kimi_k2.5_dummy.yaml --max-layers 2
#   '

model:
  name: "moonshotai/Kimi-K2.5"
  device: "cuda"
  dtype: "bfloat16"
  dummy: true                    # skip loading .safetensors shards; use zero weights

data:
  dataset_name: "c4"
  batch_size: 8
  num_samples: 16
  max_length: 512
  num_workers: 4
  val_samples: 8

quantization:
  gsq_bits: 2
  init_method: "gptq"
  gsq_enabled: true
  start_layer: 0
  self_attn: false
  std: 0.01
  temperature: [2, 0.5]
  scale: [10, 50]
  groupsize: 128
  strength: 6
  logits_dtype: "bfloat16"

training:
  num_epochs: 1
  device_microbatch_size: 4
  masks_lr: 0.0002
  signs_lr: 0.0001
  scales_lr: 0.0001
  weight_decay: 1.0
  checkpoint_dir: "checkpoints/kimi-k2.5-dummy"
  log_dir: "logs/kimi-k2.5-dummy"
  eval_baseline: True

gptq:
  nsamples: 16
  wbits: 2
  sym: true
  trits: false
  percdamp: 0.1
  blocksize: 128
  groupsize: 128
  static_groups: false
  prunen: 0
  prunem: 0

wandb: false
