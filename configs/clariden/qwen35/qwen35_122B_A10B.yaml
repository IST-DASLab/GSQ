# Clariden production config — Qwen3.5-122B-A10B (MoE)
# Uses absolute NVMe scratch paths; do not use this config on other machines.
#
# Model: Qwen/Qwen3.5-122B-A10B  (model_type: qwen3_5_moe)
#   Architecture (same family as Qwen3.5-35B-A3B, confirmed by model card):
#   - Routed experts and num_hidden_layers: probe with AutoConfig before submitting
#     (requires transformers >= 5.3.0; .venv has older version — use venv-gsq-cuda)
#   - Hybrid attention: layer_types list — "linear_attention" + "full_attention" (every 4th)
#   - Shared expert per layer: shared_expert + shared_expert_gate (Linear, sigmoid gated)
#   - Expert weights: 3D fused tensors gate_up_proj[E, 2*I, H] / down_proj[E, H, I]
#
# NOTE: Requires transformers >= 5.3.0 for Qwen3.5 MoE support.
#
# Scaling guidance (4 GPUs/node) — update once architecture is confirmed:
#   Aim for ~16–32 experts/GPU.
#
# Scratch layout:
#   /iopsstor/scratch/cscs/$USER/
#     .hf/                              ← HF_HOME  (set in gsq.toml)
#     gsq/
#       checkpoints/qwen35-122b/        ← per-layer .safetensors shards
#       logs/qwen35-122b/               ← Python training logs

model:
  name: "Qwen/Qwen3.5-122B-A10B"
  device: "cuda"
  dtype: "bfloat16"

data:
  dataset_name: "open_thoughts"
  batch_size: 64
  num_samples: 4096
  max_length: 4096
  num_workers: 8
  val_samples: 128

quantization:
  gsq_bits: 2
  init_method: "gptq"
  gsq_enabled: true
  start_layer: 0
  self_attn: false
  std: 0.01
  temperature: [2, 0.05]
  scale: [100, 500]
  groupsize: 128
  strength: 6
  logits_dtype: "bfloat16"

training:
  num_epochs: 10
  device_microbatch_size: 2
  masks_lr: 0.0002
  signs_lr: 0.0001
  scales_lr: 0.0001
  weight_decay: 1.0
  checkpoint_dir: "/iopsstor/scratch/cscs/stabesh/gsq/checkpoints/qwen35-122b"
  log_dir: "/iopsstor/scratch/cscs/stabesh/gsq/logs/qwen35-122b"
  act_cache_dir: "/iopsstor/scratch/cscs/stabesh/gsq/act_cache"
  eval_baseline: true
  # ppl_eval_every_n_layers: 6

gptq:
  nsamples: 512
  wbits: 2
  sym: true
  trits: false
  percdamp: 0.1
  blocksize: 128
  groupsize: 128
  static_groups: false
  prunen: 0
  prunem: 0

wandb:
  enabled: true
  entity: "ist"
  project: "GSQ-multi"
