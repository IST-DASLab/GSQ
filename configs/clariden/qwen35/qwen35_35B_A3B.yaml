# Clariden production config — Qwen3.5-35B-A3B (MoE)
# Uses absolute NVMe scratch paths; do not use this config on other machines.
#
# Model: Qwen/Qwen3.5-35B-A3B  (model_type: qwen3_5_moe)
#   Architecture confirmed via AutoConfig (transformers 5.3.0):
#   - 256 routed experts, 8 active per token
#   - 40 decoder layers
#   - Hybrid attention: layer_types list — "linear_attention" (GatedDeltaNet) + "full_attention" (every 4th)
#   - Shared expert per layer: shared_expert + shared_expert_gate (Linear, sigmoid gated)
#   - Expert weights: 3D fused tensors gate_up_proj[E, 2*I, H] / down_proj[E, H, I]
#   - Expert intermediate size: moe_intermediate_size=512, hidden_size=2048
#
# NOTE: Requires transformers >= 5.3.0 for Qwen3.5 MoE support.
#
# Scaling guidance (4 GPUs/node):
#   1 node  ( 4 GPUs) — 64 experts/GPU, ~12h for 40 layers
#   2 nodes ( 8 GPUs) — 32 experts/GPU, ~6h  for 40 layers
#   4 nodes (16 GPUs) — 16 experts/GPU, ~3h  for 40 layers
#
# Scratch layout:
#   /iopsstor/scratch/cscs/$USER/
#     .hf/                              ← HF_HOME  (set in gsq.toml)
#     gsq/
#       checkpoints/qwen35-35b/         ← per-layer .safetensors shards
#       logs/qwen35-35b/                ← Python training logs

model:
  name: "Qwen/Qwen3.5-35B-A3B"
  device: "cuda"
  dtype: "bfloat16"

data:
  dataset_name: "open_thoughts"
  batch_size: 64
  num_samples: 4096
  max_length: 4096
  num_workers: 8
  val_samples: 128

quantization:
  gsq_bits: 2
  init_method: "gptq"
  gsq_enabled: true
  start_layer: 0
  self_attn: false
  std: 0.01
  temperature: [2, 0.05]
  scale: [100, 500]
  groupsize: 128
  strength: 6
  logits_dtype: "bfloat16"   # "float32" for higher precision logits (more memory)

training:
  num_epochs: 10
  device_microbatch_size: 4
  masks_lr: 0.0002
  signs_lr: 0.0001
  scales_lr: 0.0001
  weight_decay: 1.0
  checkpoint_dir: "/iopsstor/scratch/cscs/stabesh/gsq/checkpoints/qwen35-35b"
  log_dir: "/iopsstor/scratch/cscs/stabesh/gsq/logs/qwen35-35b"
  act_cache_dir: "/iopsstor/scratch/cscs/stabesh/gsq/act_cache"
  eval_baseline: true
  # ppl_eval_every_n_layers: 6

gptq:
  nsamples: 512
  wbits: 2
  sym: true
  trits: false
  percdamp: 0.1
  blocksize: 128
  groupsize: 128
  static_groups: false
  prunen: 0
  prunem: 0

wandb:
  enabled: false
  entity: "ist"
  project: "GSQ-multi"
