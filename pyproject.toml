[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsq"
version = "0.1.0"
description = "Gumbel Softmax Quantization for large language models"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "transformers",
    "accelerate",
    "datasets",
    "safetensors",
    "compressed-tensors",
    "lion-pytorch",
    "wandb",
    "tqdm",
    "pyyaml",
    "python-dotenv",
    "tiktoken",
    "lm-eval[api]",
    "lighteval",
    "torch",
    "vllm",
    "ray",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ── Pin torch (and friends) to the PyTorch CUDA wheel index ────────────────
# Default is cu128. To target a different CUDA version, override the index URL
# at the command line, e.g.:
#   UV_INDEX_PYTORCH=https://download.pytorch.org/whl/cu124 uv sync
# or pass --index-strategy unsafe-best-match with --index pytorch=<url>.
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
